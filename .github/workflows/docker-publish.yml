name: Docker Publish

on:
  push:
    branches:
      - main
      - beta

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SOURCE_DATE_EPOCH from git commit
        id: get_timestamp
        run: |
          echo "timestamp=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
    
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer/
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dyadtutorialcomponents:latest
            ghcr.io/${{ github.repository_owner }}/dyadtutorialcomponents:${{ github.ref_name }}
          build-args: |
            SOURCE_CODE_EPOCH=${{ steps.get_timestamp.outputs.timestamp }}
            JULIA_DOCKER_PRECOMPILE=true